services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech_local_only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: golang:1.23-alpine
    working_dir: /src
    command: ["sh", "-c", "go mod download && go run ./cmd/api"]
    volumes: [".:/src"]
    environment:
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
